# JARVIS Remote — version catalog (single place to bump AGP/Kotlin/Compose).
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
compose = "1.7.5"
compose-bom = "2024.11.00"
activity = "1.9.3"
core = "1.15.0"
lifecycle = "2.8.7"
okhttp = "4.12.0"
coroutines = "1.9.0"

[libraries]
androidx-core-ktx       = { group = "androidx.core",       name = "core-ktx",                 version.ref = "core" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose",        version.ref = "activity" }
androidx-lifecycle-vm   = { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom            = { group = "androidx.compose",    name = "compose-bom",              version.ref = "compose-bom" }
compose-ui             = { group = "androidx.compose.ui",  name = "ui" }
compose-material3      = { group = "androidx.compose.material3", name = "material3" }
compose-tooling-preview= { group = "androidx.compose.ui",  name = "ui-tooling-preview" }
compose-tooling        = { group = "androidx.compose.ui",  name = "ui-tooling" }
okhttp                 = { group = "com.squareup.okhttp3", name = "okhttp",                  version.ref = "okhttp" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
